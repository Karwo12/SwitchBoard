name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\SwitchBoard.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build .\SwitchBoard.sln -c Release --no-restore

      - name: Test Release
        shell: pwsh
        run: dotnet test .\SwitchBoard.sln -c Release --no-build --no-restore
